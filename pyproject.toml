[project]
name = "dagster_loaders"
requires-python = ">=3.12,<3.15"
version = "0.1.0"
dependencies = [
    "dagster",
    "dagster-cloud>=1.13.2",
    "mc-postgres-db==1.3.1",
    "pandas>=2.2.3",
    "psycopg2-binary>=2.9.10",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.41",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "docker>=7.0.0",
    "pytest>=8.4.0",
    "responses>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_loaders"
registry_modules = [
    "dagster_loaders.components.*",
]


